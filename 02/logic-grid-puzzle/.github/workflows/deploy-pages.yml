name: Deploy Logic Grid Puzzle

on:
  push:
    branches: ["main"]
    paths:
      - "02/logic-grid-puzzle/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "02/logic-grid-puzzle/package-lock.json"

      - name: Install
        working-directory: 02/logic-grid-puzzle
        run: npm ci

      - name: Build
        working-directory: 02/logic-grid-puzzle
        run: npm run build

      - name: Prepare Pages Artifact
        run: |
          mkdir -p pages/02/logic-grid-puzzle
          cp -r 02/logic-grid-puzzle/dist/* pages/02/logic-grid-puzzle/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
